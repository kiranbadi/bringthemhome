services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: on-failure

    environment:
      MYSQL_ROOT_PASSWORD: kiran
      MYSQL_DATABASE: local_db
      MYSQL_USER: kiran
      MYSQL_PASSWORD: kiran
    ports:
      - "3306:3306"
    volumes:
      - data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkiran"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  data:
