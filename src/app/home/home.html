<app-navigation-header />

<main class="home-shell">
  <section class="search-panel" aria-label="Missing person search">
    <form class="search-form" [formGroup]="searchForm" (ngSubmit)="search()">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search missing persons</mat-label>
        <mat-icon matPrefix aria-hidden="true">search</mat-icon>
        <input
          matInput
          type="search"
          formControlName="query"
          autocomplete="off"
          placeholder="Name, zipcode, city, or state"
        />
      </mat-form-field>

      <div class="search-actions">
        <button matButton="filled" type="submit">
          <mat-icon aria-hidden="true">search</mat-icon>
          Search
        </button>
      </div>
    </form>
  </section>

  <section class="missing-person-grid" aria-label="Missing persons">
    @for (person of pagedMissingPersons; track person.id) {
      <mat-card
        class="person-card"
        appearance="outlined"
        [routerLink]="['/missing-person', person.id]"
        tabindex="0"
      >
        <div class="carousel">
          <img [src]="currentPhoto(person)" [alt]="person.fullName" />

          <button
            class="carousel-button previous"
            matIconButton
            type="button"
            [attr.aria-label]="'Previous photo for ' + person.fullName"
            (click)="$event.stopPropagation(); previousPhoto(person)"
          >
            <mat-icon aria-hidden="true">chevron_left</mat-icon>
          </button>

          <button
            class="carousel-button next"
            matIconButton
            type="button"
            [attr.aria-label]="'Next photo for ' + person.fullName"
            (click)="$event.stopPropagation(); nextPhoto(person)"
          >
            <mat-icon aria-hidden="true">chevron_right</mat-icon>
          </button>
        </div>

        <mat-card-header>
          <mat-card-title>{{ person.fullName }}</mat-card-title>
          <mat-card-subtitle>Last seen {{ person.lastSeenDate }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <div class="person-detail">
            <mat-icon aria-hidden="true">location_on</mat-icon>
            <span>{{ person.city }}, {{ person.state }} {{ person.zipcode }}</span>
          </div>
        </mat-card-content>

        <mat-card-actions>
          <button matButton type="button" (click)="$event.stopPropagation(); sharePerson(person)">
            <mat-icon aria-hidden="true">share</mat-icon>
            Share
          </button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p class="empty-state">No missing persons match the current search.</p>
    }
  </section>

  <mat-paginator
    class="missing-person-paginator"
    [length]="totalMissingPersons"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Missing persons pagination"
    (page)="pageChanged($event)"
  />
</main>
