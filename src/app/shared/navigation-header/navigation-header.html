<mat-toolbar class="navigation-header">
  <a class="brand" routerLink="/" aria-label="Bring Them Home">
    <mat-icon aria-hidden="true">home</mat-icon>
    <span>Missing Lives</span>
  </a>

  <nav class="navigation-links" aria-label="Primary navigation">
    @for (link of links; track link.route) {
      <a
        matButton
        [routerLink]="link.route"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ link.label }}
      </a>
    }
    @if (currentUser$ | async) {
      <a
        matButton
        routerLink="/photo-review"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Photo Review</a
      >
      <button
        matButton
        type="button"
        (click)="logout()"
        [disabled]="loggingOut()"
        [attr.aria-busy]="loggingOut()"
      >
        <mat-icon aria-hidden="true">logout</mat-icon>
        {{ loggingOut() ? 'Logging out…' : 'Logout' }}
      </button>
    }
  </nav>
</mat-toolbar>
